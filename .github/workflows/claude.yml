name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Responde cuando alguien escribe @claude en un comentario, issue o revisión.
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Necesario para que Claude lea los resultados de CI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Sin credencial la acción falla y pinta el check en rojo. Preferimos
      # saltarla y dejar constancia en el resumen del run. Vale cualquiera de
      # las dos: el token de la suscripción o la clave de API.
      - name: Comprobar credencial
        id: guard
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            echo "Falta credencial: define el secreto CLAUDE_CODE_OAUTH_TOKEN (\`claude setup-token\`) o ANTHROPIC_API_KEY. Se omite el paso." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Revisión automática al abrir o actualizar un pull request.
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Comprobar credencial
        id: guard
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            echo "Falta credencial: define el secreto CLAUDE_CODE_OAUTH_TOKEN (\`claude setup-token\`) o ANTHROPIC_API_KEY. Se omite la revisión." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revisión automática
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Revisa este pull request. Ojo: este repositorio es configuración de
            Claude Code, no una aplicación. Contiene scripts de shell en
            .claude/hooks/ y .claude/bootstrap.sh, JSON en .claude/settings.json
            y .mcp.json, y skills en markdown bajo .claude/skills/.

            Prioriza, por este orden:

            1. Scripts de shell: que no puedan romper el arranque de una sesión.
               Comprueba el comillado de variables, las rutas relativas frágiles
               y que degraden en silencio (exit 0) cuando falte un fichero o no
               haya red, en vez de abortar.
            2. JSON: sintaxis válida y coherencia interna. Señala como dudosa
               cualquier clave que no reconozcas — una clave inventada se ignora
               en silencio y el fallo pasa desapercibido — pero preséntala como
               sospecha, no como error confirmado.
            3. Hooks: que la salida de SessionStart tenga la forma que Claude
               Code espera (hookSpecificOutput con hookEventName y
               additionalContext).
            4. Secretos: que no se haya colado ninguna credencial, token ni ruta
               privada.
            5. Documentación: que CLAUDE.md siga describiendo lo que el código
               hace realmente.

            No tienes acceso a internet: la acción bloquea WebFetch y WebSearch.
            No gastes turnos intentando descargar esquemas ni documentación.
            Trabaja solo con lo que hay en el repositorio.

            Publica los hallazgos SIEMPRE, como último paso y aunque no hayas
            podido completar todas las comprobaciones: vale más un informe
            parcial diciendo qué quedó sin revisar que ningún informe. No
            comentes cuestiones de estilo menores. Si no encuentras nada
            relevante, dilo en un solo comentario breve en vez de inventar
            hallazgos.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
